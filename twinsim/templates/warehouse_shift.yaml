# 倉庫のシフトの始まり（1.2 の部品: 作業点に定員と列）: 作業者が荷受けから来て打刻機に並び、待つ場所で指示を待ってから、
# 棚を何か所か番号の順に回ってピッキングし（visits）、梱包の台（4 台。空くのを待つ人は列に並ぶ）で梱包するのを繰り返す。
# 早く来た人の一部は、休憩の長椅子で座って待ってから打刻する。20 分。状態: pass（移動）・work（棚の前・梱包の台で作業）・wait（指示を待つ）・
# service_queue（打刻機・梱包の台の列）・service（打刻）・seated（長椅子）。
# 棚の前で止まる時間は、ピッキングの時間の内訳（移動 5 割、Tompkins ら 2010・de Koster ら 2007）に合うように決めた（docs/validity.md の 5.12）。
# 来る人の数・打刻・指示を待つ・梱包の時間・回る棚の数・長椅子で待つ割合と時間は、文献の値がないので仮（台帳）。
name: warehouse_shift
title: 倉庫のシフトの始まり（打刻機の列・ピッキング・梱包の台の列・休憩の長椅子、20 分）
title_en: "Warehouse shift start (time clock queue, picking, packing table queue, break benches, 20 minutes)"
space: warehouse
seed: 1
duration_s: 1200
people:
  speed: {type: normal, mean: 1.3, sd: 0.15, min: 0.9, max: 1.7}   # 仮（warehouse_picking と同じ）
streams:
  - name: shift
    origin: dock
    rate: {type: piecewise, per_min: [[0, 2.0], [480, 2.0], [540, 0.3], [1200, 0.3]], unit: persons}   # 仮: 始まり（8 分）までに 16 人ほど
    destinations:
      - to: time_clock
        p: 0.8
        then: &after_clock
          to: staging                # 待つ場所で指示を待つ
          state: wait
          dwell: {type: uniform, min: 20, max: 90}
          then:
            <<: &pick {to: pick, visits: {type: choice, values: {6: 0.3, 7: 0.4, 8: 0.3}}, state: work, dwell: {type: lognormal, median: 9, sigma: 0.4, min: 4, max: 60}}
            then:
              to: packing
              then:
                <<: *pick
                then:
                  to: packing
                  then:
                    <<: *pick
                    then:
                      to: packing
                      then:
                        <<: *pick
                        then:
                          to: packing
                          then:
                            <<: *pick
                            then:
                              to: packing
                              then:
                                <<: *pick
                                then:
                                  to: packing
                                  then:
                                    <<: *pick
                                    then: {to: packing, then: dock}
      - to: break_seats              # 早く来た人: 長椅子で待ってから打刻する（仮）
        p: 0.2
        dwell: {type: lognormal, median: 150, sigma: 0.5, min: 40, max: 480}
        then: {to: time_clock, then: *after_clock}
services:
  time_clock: {service_s: {type: lognormal, median: 4, sigma: 0.3, min: 2, max: 15}, note: 仮（打刻）}
  packing: {service_s: {type: lognormal, median: 30, sigma: 0.4, min: 15, max: 180}, state: work, note: 仮（1 回の梱包）}
cameras:
  - {name: CamDock}
  - {name: CamPack}
  - {name: CamAisles}
