# ゲート → エレベーター前の 2 地点の流れ。朝の出勤のいちばん混む 5 分。カメラはゲートと EV 前の 2 台。
# 人の分布は文献の値: people.profile（速さ・グループ・速さと密度・ゲート・EV の乗り降り）と demand（EV を使う人の量）。
# 文献のない値には「仮」と書いた（ゲートの通過記録・EV の運行記録で合わせる）。根拠の一覧は docs/validity.md、計算ごとの台帳は validity.md。
name: office_gate_ev
title: ゲート → エレベーター（朝の混む 5 分、カメラ 2 台）
title_en: "Gate → elevator (busiest 5 morning minutes, 2 cameras)"
space: office
seed: 31
duration_s: 300
people:
  profile: office_commute_jp
demand:                      # EV を使う人の量（Peters ら 2011）
  population: 600            # 建物にいる人数（仮: 建物の値を入れる。EV 2 台・8 人乗り・約 48 秒おきで運べるのは 5 分で約 80 人 → 在館 650 人ほどまで）
  period: morning            # 朝の山: 入る 85%・出る 10%・階の間 5%
  peak_pct_5min: 12          # いちばん混む 5 分に EV を使う人の割合（観測の最大 12〜13%）
streams:
  - name: commuters          # EV へ（入る流れの 90%。残りは来客と待ち合わせ）
    origin: entrance
    rate: {type: lift_demand, flow: incoming, share: 0.90}
    types: staff
    destinations:
      - {to: elevator, via: [gate]}
  - name: visitors           # 受付 → EV（入る流れの 7%、仮）
    origin: entrance
    rate: {type: lift_demand, flow: incoming, share: 0.07}
    types: visitor
    destinations:
      - {to: reception, via: [gate], dwell: {type: lognormal, median: 25, sigma: 0.4, min: 8, max: 90}, then: elevator}
  - name: meet               # ラウンジで待ち合わせ → EV（入る流れの 3%、仮）
    origin: entrance
    rate: {type: lift_demand, flow: incoming, share: 0.03}
    types: staff
    destinations:
      - {to: lounge, via: [gate], meet: {p: 1.0, delay: {type: uniform, min: 10, max: 30}, from: entrance, via: [gate]}, then: elevator}
  - name: ground_floor       # 1 階の奥へ（EV を使わない、仮）
    origin: entrance
    rate: {type: constant, per_min: 2.5, unit: persons}
    types: staff
    destinations:
      - {to: south_exit, p: 0.6, via: [gate]}
      - {to: west_corridor, p: 0.4, via: [gate]}
  - name: through            # ゲートの内側の通り抜け（仮）
    origin: south_exit
    rate: {type: constant, per_min: 2, unit: persons}
    destinations:
      - {to: west_corridor, p: 0.5}
      - {to: east_room, p: 0.5}
elevator:
  cars: [EV1, EV2]
  capacity: 8
  schedule: {type: interval, offset: {type: uniform, min: 5, max: 40}, interval: {type: uniform, min: 35, max: 60}}   # 仮（EV の運行記録で合わせる）
  alight:
    count: {type: lift_demand, flow: outgoing}   # 出る流れ（朝は 10%）を EV の着く回数で割る
    types: staff
    destinations:            # 仮
      - {to: entrance, p: 0.6, via: [gate]}
      - {to: south_exit, p: 0.4}
cameras:
  - {name: CamGate}
  - {name: CamEV}
render:
  props: []
