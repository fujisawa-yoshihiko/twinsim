# 空間: Isaac Sim 6.1 付属の病院の 1 階。ロビー（東）→ 中央の廊下 → 西の広間。場所とカメラは hospital-sim の場面（sim-gate・sim-hall）と同じ。
# 注意: この USD にエレベーターはない。西の広間の階段室の前に、描画のときに office の EV のかごと扉の枠を置く（pois の EV の prop: elevator、2026-11-05）。
# 計算では、かごの所を歩けなくし（levels の blocked）、乗る人はかごの 1 m 奥まで歩いてから消える。
# 部屋の扉は閉じたままナビメッシュを焼いたので、部屋の中は歩ける所に入っていない（廊下・ロビー・広間だけ）。
name: hospital
title: 病院の 1 階（ロビー → 廊下 → 西の広間。EV は見立て）
title_en: "Hospital ground floor (lobby → corridor → west hall; the elevator is a stand-in)"
usd: https://omniverse-content-production.s3-us-west-2.amazonaws.com/Assets/Isaac/6.1/Isaac/Environments/Hospital/hospital.usd
license: CC BY 4.0（NVIDIA Isaac Sim の素材。配布するときはクレジットを書く）
license_en: "CC BY 4.0 (NVIDIA Isaac Sim assets; give credit when distributing)"
ceiling_m: 2.97            # 天井の高さ（床から）。これより上のカメラは誤り（正解の枠が天井を知らないため）。照明の下面 2.97 m・天井 2.99 m（同）
navmesh_region: [-50.0, 27.0, -5.0, 37.5, 0.0, 3.0]
glass:                    # ガラスの奥の人の隠れ（twinsim/glass.py。ガラス板の位置は glass.json）
  occluding: []
  note: M_Glass ほか。確かめた 54 本（2026-11-04）では奥に人が入る場面がなく、決めていない
levels:
  - name: 1F
    z: 0.0
    walkable: walkable_1f.npz
    blocked:   # 描画で置く EV のかご（2 m × 2 m、扉は y = 13.2 で南向き）。扉の点の格子は歩けるまま
      - {polygon: [[-29.55, 13.4], [-27.45, 13.4], [-27.45, 15.3], [-29.55, 15.3]], note: EV のかご（pois の EV の prop）}
    top_image: top_1f.jpg
    top_view: {eye: [-11.5, 16.24, 80.0], target: [-11.5, 16.25, 0.0], focal_mm: 20.735, h_aperture_mm: 20.955, width: 1280, height: 720}

pois:
  lobby_entrance: {kind: spawn, xy: [8.5, -1.0], hidden: [11.8, -1.0], note: ロビーのカメラの手前（hospital-sim の GATE）。人はカメラの後ろ（hidden）に現れ、カメラの下をくぐって入る}
  west:           {kind: spawn, xy: [-35.5, 11.2], note: 西の廊下}
  EV:             {kind: elevator, xy: [-28.5, 13.2], face: [-28.5, 14.4], cabin_m: 1.0, prop: elevator, note: 階段室の前（USD に EV がないので、描画で office の EV のかごと扉の枠を置く（render の prop、2026-11-05）。乗る人はかごの 1 m 奥まで歩いてから消え、降りる人はそこから出てくる。かごの所は歩けない（levels の blocked））}
  ev_wait:        {kind: wait_zone, zone: ev_hall, spacing: 0.8, door_aisle: 0.6}
  reception_1:    {kind: spot, xy: [2.0, 3.0], face: [2.0, 4.0], note: ロビーの受付の前}
  reception_2:    {kind: spot, xy: [2.75, 3.0], face: [3.0, 4.0]}
  hall_side:      {kind: exit, xy: [-21.0, 4.0], note: 広間の南東}
  west_room:      {kind: exit, xy: [-12.5, 9.25], note: ロビーの西の部屋の前}

zones:
  ev_hall:   {polygon: [[-31.6, 10.3], [-25.6, 10.3], [-25.6, 13.0], [-31.6, 13.0]]}
  hall:      {polygon: [[-34.0, 3.5], [-23.5, 3.5], [-23.5, 24.0], [-34.0, 24.0]]}
  lobby:     {polygon: [[-8.0, -3.0], [11.0, -3.0], [11.0, 10.0], [-8.0, 10.0]]}
  corridor:  {polygon: [[-23.5, 3.5], [-8.0, 3.5], [-8.0, 12.0], [-23.5, 12.0]]}

cameras:
  CamGate: {eye: [10.5, -2.0, 2.7], target: [4.8, 2.8, 0.0], note: ロビー（sim-gate と同じ）, note_en: "Lobby (same as sim-gate)"}
  CamHall: {eye: [-26.5, 3.2, 2.7], target: [-28.5, 11.0, 0.0], note: 西の広間の南側から北の待つ場所と扉を見る（sim-gate・sim-hall と同じ）, note_en: "Looks from the south side of the west hall at the waiting area and doors to the north (same as sim-gate and sim-hall)"}