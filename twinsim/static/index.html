<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>twinsim</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>twinsim</h1>
  <label><span data-en="Template">テンプレート</span> <select id="template"></select></label>
  <span id="space-name" class="muted"></span>
  <span id="isaac" class="pill" data-en="Isaac Sim: checking">Isaac Sim: 確認中</span>
  <select id="lang" title="言語" data-en-title="Language"><option value="ja">日本語</option><option value="en">English</option></select>
</header>
<main>
  <section id="map-pane">
    <div class="map-tools">
      <label><input type="checkbox" id="show-zones" checked> <span data-en="Zones">ゾーン</span></label>
      <label><input type="checkbox" id="show-pois" checked> <span data-en="Places">場所</span></label>
      <label><input type="checkbox" id="show-frustum" checked> <span data-en="Camera fields of view">カメラの映る範囲</span></label>
      <span class="muted" data-en="Camera ● = position, ■ = look-at point (drag to move)">カメラの● = 位置、■ = 見る点（ドラッグで動かせる）</span>
    </div>
    <canvas id="map"></canvas>
    <div id="cursor" class="muted">x —, y —</div>
  </section>
  <section id="side">
    <nav class="tabs">
      <button data-tab="settings" class="active" data-en="Settings">設定</button>
      <button data-tab="results" data-en="Results">結果</button>
    </nav>
    <div id="tab-settings" class="tab">
      <fieldset>
        <legend data-en="Basic">基本</legend>
        <label><span data-en="Duration (s)">長さ（秒）</span><input type="number" id="duration" min="10" step="10"></label>
        <label><span data-en="Random seed">乱数の種</span> <input type="number" id="seed" step="1"></label>
      </fieldset>
      <fieldset id="people-box">
        <legend data-en="Distribution of people (literature)">人の分布（文献）</legend>
        <label class="block"><span data-en="Literature profile">文献の値の組</span><select id="profile"></select></label>
        <div class="muted" id="profile-note"></div>
        <div class="row" id="demand-row">
          <label><span data-en="Building population">建物にいる人数</span> <input type="number" id="demand-pop" min="1" step="10"></label>
          <label><span data-en="Time of day">時間帯</span> <select id="demand-period"><option value="morning" data-en="Morning (in 85%, out 10%)">朝（入る 85%・出る 10%）</option><option value="lunch" data-en="Lunch (in 45%, out 45%)">昼（入る 45%・出る 45%）</option></select></label>
          <label><span data-en="Share in the busiest 5 min (%)">混む 5 分の割合（%）</span><input type="number" id="demand-pct" min="1" max="30" step="0.5"></label>
        </div>
        <div class="muted" data-en="EV users = population × share ÷ 5 min (Peters et al. 2011; the observed maximum is 12–13%). Applies to streams whose arrivals come &quot;from the building population&quot;.">EV を使う人の量 = 人数 × 割合 ÷ 5 分（Peters ら 2011。観測の最大 12〜13%）。到着が「建物の人数から」の流れに効く。</div>
      </fieldset>
      <fieldset>
        <legend data-en="Streams of people">人の流れ</legend>
        <div class="muted" data-en="Drag the green squares on the map to move where people appear.">図の緑の四角をドラッグすると、人の現れる所を動かせます。</div>
        <div id="streams"></div>
      </fieldset>
      <fieldset id="ev-box">
        <legend data-en="Elevator">エレベーター</legend>
        <div class="row">
          <label><span data-en="Min. arrival interval (s)">着く間隔の最小（秒）</span><input type="number" id="ev-min" step="1"></label>
          <label><span data-en="Max.">最大</span> <input type="number" id="ev-max" step="1"></label>
        </div>
        <div class="row">
          <label><span data-en="Capacity">定員</span> <input type="number" id="ev-cap" step="1" min="1"></label>
          <label><span data-en="People alighting (mean)">降りる人（平均）</span><input type="number" id="ev-alight" step="0.1" min="0"></label>
        </div>
      </fieldset>
      <fieldset id="gate-box">
        <legend data-en="Gates">ゲート</legend>
        <div id="gates"></div>
      </fieldset>
      <fieldset>
        <legend data-en="Cameras">カメラ</legend>
        <div id="cameras"></div>
        <button id="add-camera" class="secondary" data-en="Add a camera">カメラを足す</button>
      </fieldset>
      <fieldset id="props-box">
        <legend data-en="Placed objects">置く物</legend>
        <div id="props"></div>
      </fieldset>
      <details>
        <summary data-en="Advanced settings (the whole scenario, JSON)">詳しい設定（シナリオの全部、JSON）</summary>
        <textarea id="spec-json" spellcheck="false"></textarea>
        <button id="apply-json" class="secondary" data-en="Apply this JSON">この JSON を反映</button>
      </details>
      <div class="actions">
        <button id="run" class="primary" data-en="Run simulation (CPU)">計算する（CPU）</button>
        <button id="download" class="secondary" data-en="Export settings">設定を書き出す</button>
      </div>
      <p id="run-msg" class="muted"></p>
    </div>
    <div id="tab-results" class="tab hidden">
      <div class="row"><button id="refresh" class="secondary" data-en="Refresh the list">一覧を更新</button></div>
      <ul id="runs"></ul>
      <div id="run-detail"></div>
    </div>
  </section>
</main>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
