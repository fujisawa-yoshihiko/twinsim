# 倉庫のピッキング（工場・物流の図の「作業・待ち・移動」）: 作業者が荷受けから通路の棚へ行って作業し、梱包の台で作業し、
# 次の指示を待ってから、もう 1 度ピッキング → 梱包をして帰る。状態: pass（移動）・work（作業）・wait（待ち）。
name: warehouse_picking
title: 倉庫のピッキング（作業・待ち・移動）
title_en: "Warehouse picking (work, waiting, moving)"
space: warehouse
seed: 5
duration_s: 300
people:
  speed: {type: normal, mean: 1.3, sd: 0.15, min: 0.9, max: 1.7}
streams:
  - name: workers
    origin: dock
    rate: {type: constant, per_min: 4}
    destinations:
      - to: pick
        state: work
        dwell: {type: lognormal, median: 15, sigma: 0.4, min: 5, max: 60}
        then:
          to: pack
          state: work
          dwell: {type: lognormal, median: 20, sigma: 0.3, min: 8, max: 60}
          then:
            to: staging
            state: wait
            dwell: {type: uniform, min: 5, max: 20}
            then:
              to: pick
              state: work
              dwell: {type: lognormal, median: 15, sigma: 0.4, min: 5, max: 60}
              then: {to: pack, state: work, dwell: {type: lognormal, median: 20, sigma: 0.3, min: 8, max: 60}, then: dock}
cameras:
  - {name: CamAisles}
  - {name: CamPack}
