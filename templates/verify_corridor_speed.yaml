# エンジンの確かめ: RiMEA の試験 1 に相当（1 人が廊下の 40 m を決めた速さ 1.33 m/s で歩けるか → 約 30.1 秒）。
# 判定は tests/test_validity.py（40 / 1.33 = 30.1 秒から ±1 秒）。
name: verify_corridor_speed
title: "確かめ: 廊下の 40 m を一定の速さで歩く（RiMEA の試験 1 に相当）"
space: corridor
seed: 1
duration_s: 40
people:
  speed: 1.33
streams:
  - name: walker
    origin: start
    rate: {type: times, times: [0.0]}
    destinations:
      - {to: finish}
outputs: [ground_truth, frames, tasks]
