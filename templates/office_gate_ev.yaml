# ゲート → エレベーター前（UC1・UC2、研究 2 の 2 地点の流れ）。朝の出勤のように到着が増えてから減る。カメラはゲートと EV 前の 2 台。
# 分布の値は文献の目安と仮の値（docs/spec.md の「妥当性」）。実データ（ゲートの通過記録・EV の運行記録）で合わせて上書きする。
name: office_gate_ev
title: ゲート → エレベーター（朝の到着の山、カメラ 2 台）
space: office
seed: 31
duration_s: 300
people:
  speed: {type: normal, mean: 1.34, sd: 0.26, min: 0.8, max: 1.9}   # Weidmann 1993 の目安
streams:
  - name: arrivals
    origin: entrance
    rate: {type: piecewise, per_min: [[0, 6], [120, 16], [240, 10], [300, 6]]}   # 人/分（時間帯で変わるポアソン過程）
    group_size: {type: zero_truncated_poisson, lam: 0.4}   # まとまりの人数（Coleman & James 1961 の形、値は仮）
    types: {type: choice, values: {staff: 0.8, visitor: 0.2}}
    destinations:
      - {to: elevator, p: 0.65, via: [gate], types: [staff]}
      - {to: reception, p: 1.0, via: [gate], types: [visitor], dwell: {type: lognormal, median: 25, sigma: 0.4, min: 8, max: 90}, then: elevator}
      - {to: lounge, p: 0.08, via: [gate], meet: {p: 1.0, delay: {type: uniform, min: 10, max: 30}, from: entrance, via: [gate]}, then: elevator}
      - {to: south_exit, p: 0.17, via: [gate], types: [staff]}
      - {to: west_corridor, p: 0.10, via: [gate], types: [staff]}
  - name: through
    origin: south_exit
    rate: {type: constant, per_min: 2}
    destinations:
      - {to: west_corridor, p: 0.5}
      - {to: east_room, p: 0.5}
elevator:
  cars: [EV1, EV2]
  capacity: 8
  schedule: {type: interval, offset: {type: uniform, min: 5, max: 40}, interval: {type: uniform, min: 35, max: 60}}
  alight:
    count: {type: poisson, lam: 1.2}
    types: {type: choice, values: {staff: 0.9, visitor: 0.1}}
    destinations:
      - {to: entrance, p: 0.6, via: [gate]}
      - {to: south_exit, p: 0.4}
gates:
  gate: {service_s: 1.6}   # 1 レーンで 1 人あたりの間隔（仮）
cameras:
  - {name: CamGate}
  - {name: CamEV}
render:
  props: []
